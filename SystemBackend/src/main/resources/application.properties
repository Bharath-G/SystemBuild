server.port=8080
spring.application.name=the-system

# Postgres database (development)
spring.datasource.url=jdbc:postgresql://localhost:5432/systemdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
# Ollama
system.ai.ollama-url=http://localhost:11434/api/generate
system.ai.model=mistral:7b-instruct-q8_0

# Memory service
system.memory.url=http://localhost:8001

# User Profile Configuration
system.user.name=Bharath
system.user.age=25
system.user.location=Earth
system.user.role=Software Engineer
system.user.employer=USBank
system.user.experience=5 years
system.user.health-status=Good
system.user.background=Building from scratch.
system.user.goals=Master the craft, build systems.
system.user.market-context=Software engineering is highly competitive.
system.user.gaps=Visibility and networking.
system.user.class-name=Software Engineer
system.user.level=1
system.user.xp=0
system.user.xp-threshold=1000
system.user.arc=The Beginning

# Google OAuth Configuration
google.client-id=placeholder-client-id
google.client-secret=placeholder-client-secret
google.redirect-uri=http://localhost:8080/api/google/callback
